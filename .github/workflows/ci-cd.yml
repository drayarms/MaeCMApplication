name: Build, Push to ECR, Deploy to EC2

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # -------------------------------
    # Load Secrets
    # -------------------------------
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
      REACT_REPO: ${{ secrets.REACT_REPO }}
      FLASK_REPO: ${{ secrets.FLASK_REPO }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      REACT_APP: ${{ secrets.REACT_APP }}
      FLASK_APP: ${{ secrets.FLASK_APP }}

      #🔐 SMTP
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }} 
      TO_EMAIL: ${{ secrets.TO_EMAIL }}       

    steps:
      # ----------------------------
      # Checkout
      # ----------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------
      # Compute IMAGE_TAG dynamically
      # ----------------------------
      #- name: Set IMAGE_TAG
        #run: |
          #IMAGE_TAG=$(git rev-parse --short HEAD)
          #echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV        

      # ----------------------------
      # Load .env (SOURCE OF TRUTH)
      # ----------------------------
      #- name: Load environment variables
        #run: |
          #set -a
          #source .env
          #set +a

          #echo "AWS_REGION=$AWS_REGION" >> $GITHUB_ENV
          #echo "ECR_REGISTRY=$ECR_REGISTRY" >> $GITHUB_ENV
          #echo "REACT_REPO=$REACT_REPO" >> $GITHUB_ENV
          #echo "FLASK_REPO=$FLASK_REPO" >> $GITHUB_ENV
          #echo "AWS_ROLE_TO_ASSUME=$AWS_ROLE_TO_ASSUME" >> $GITHUB_ENV
          #echo "REACT_APP=$REACT_APP" >> $GITHUB_ENV
          #echo "FLASK_APP=$FLASK_APP" >> $GITHUB_ENV

          #IMAGE_TAG=$(git rev-parse --short HEAD)
          #echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV


      # ----------------------------
      # Configure AWS (OIDC)
      # ----------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------
      # Login to ECR
      # ----------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ----------------------------
      # Build images
      # ----------------------------
      - name: Build images
        run: |
          docker compose build react flask

      # ----------------------------
      # Tag & Push images (immutable)
      # ----------------------------
      - name: Push images to ECR
        run: |
          docker tag react-app:latest  $ECR_REGISTRY/$REACT_REPO:latest  #Ensure name (react-app) matches in docker-compose
          docker tag flask-app:latest  $ECR_REGISTRY/$FLASK_REPO:latest  #Ensure name (flask-app) matches in docker-compose

          docker push $ECR_REGISTRY/$REACT_REPO:latest
          docker push $ECR_REGISTRY/$FLASK_REPO:latest         

      # ----------------------------
      # Upload files to EC2
      # ----------------------------
      - name: Upload compose files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml,.env"
          target: "/home/${{ secrets.EC2_USER }}/app"

      # ----------------------------
      # Deploy on EC2 (IAM ROLE)
      # ----------------------------
      #- name: Deploy to EC2
        #uses: appleboy/ssh-action@v0.1.10
        #with:
          #host: ${{ secrets.EC2_HOST }}
          #username: ${{ secrets.EC2_USER }}
          #key: ${{ secrets.EC2_SSH_KEY }}
          #script: |
            #set -e
            #cd ~/app

            #set -a
            #source .env
            #set +a

            #aws ecr get-login-password --region $AWS_REGION \
              #| docker login --username AWS --password-stdin $ECR_REGISTRY

            #docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            #docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

      # ----------------------------
      # Deploy on EC2 (with env vars) -IAM Role-
      # ----------------------------
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/app

            # Export all env vars (secrets + dynamic IMAGE_TAG)
            export AWS_REGION="${AWS_REGION}"
            export ECR_REGISTRY="${ECR_REGISTRY}"
            export REACT_APP="${REACT_APP}"
            export FLASK_APP="${FLASK_APP}"
            #export IMAGE_TAG="${IMAGE_TAG}"

            export SMTP_HOST="${SMTP_HOST}"
            export SMTP_PORT="${SMTP_PORT}"
            export SMTP_USER="${SMTP_USER}"
            export SMTP_PASS="${SMTP_PASS}"
            export TO_EMAIL="${TO_EMAIL}"

            # Login to ECR
            aws ecr get-login-password --region $AWS_REGION \
              | docker login --username AWS --password-stdin $ECR_REGISTRY

            # Pull latest images
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull

            # Start services
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans









