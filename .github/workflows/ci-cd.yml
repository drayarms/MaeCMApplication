name: Build, Push to ECR, Deploy to EC2

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      # AWS / ECR
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
      REACT_REPO: ${{ secrets.REACT_REPO }}
      FLASK_REPO: ${{ secrets.FLASK_REPO }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      # SMTP
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      TO_EMAIL: ${{ secrets.TO_EMAIL }}

    steps:
      # ----------------------------
      # Checkout code
      # ----------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------
      # Configure AWS credentials (OIDC)
      # ----------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------
      # Login to Amazon ECR
      # ----------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ----------------------------
      # Build Docker images
      # ----------------------------
      - name: Build Docker images
        run: |
          docker compose build react flask

      # ----------------------------
      # Tag & Push Docker images (latest)
      # ----------------------------
      - name: Tag & Push Docker images
        run: |
          docker tag react-app:latest  $ECR_REGISTRY/$REACT_REPO:latest
          docker tag flask-app:latest  $ECR_REGISTRY/$FLASK_REPO:latest

          docker push $ECR_REGISTRY/$REACT_REPO:latest
          docker push $ECR_REGISTRY/$FLASK_REPO:latest

      # ----------------------------
      # Upload docker-compose files to EC2
      # ----------------------------
      - name: Upload docker-compose files to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml"
          target: "/home/${{ secrets.EC2_USER }}/app"

      # ----------------------------
      # Create .env directly on EC2
      # ----------------------------
      - name: Create .env on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/app
            cat > ~/app/.env <<EOF
            SMTP_HOST=${{ env.SMTP_HOST }}
            SMTP_PORT=${{ env.SMTP_PORT }}
            SMTP_USER=${{ env.SMTP_USER }}
            SMTP_PASS=${{ env.SMTP_PASS }}
            TO_EMAIL=${{ env.TO_EMAIL }}
            EOF

      # ----------------------------
      # Deploy services on EC2
      # ----------------------------
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/app

            # Pull latest images
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull

            # Deploy services (uses .env automatically)
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
