name: CD-Deploy

on:
  workflow_run:
    workflows: ["CI-Build"]
    types: [completed]

permissions:
  contents: read
  actions: read  # Required to download artifacts

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo (needed only for .env if used)
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2️⃣ Download image-tags artifact from CI
      - name: Download image tags
        uses: actions/download-artifact@v4
        with:
          name: image-tags

      # 3️⃣ Load image tags into environment
      - name: Load image tags
        run: |
          set -a
          source image-tags.env
          set +a
          echo "FRONTEND_TAG=$FRONTEND_TAG" >> $GITHUB_ENV
          echo "BACKEND_TAG=$BACKEND_TAG" >> $GITHUB_ENV

      # 4️⃣ Deploy on EC2
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v0.1.10
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECR_REPO: ${{ secrets.ECR_REPO }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          FRONTEND_TAG: ${{ env.FRONTEND_TAG }}
          BACKEND_TAG: ${{ env.BACKEND_TAG }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            APP_DIR="/home/${{ secrets.EC2_USER }}/app"
            mkdir -p $APP_DIR
            cd $APP_DIR

            echo "===== Environment Variables ====="
            echo "ECR_REGISTRY=$ECR_REGISTRY"
            echo "ECR_REPO=$ECR_REPO"
            echo "AWS_REGION=$AWS_REGION"
            echo "FRONTEND_TAG=$FRONTEND_TAG"
            echo "BACKEND_TAG=$BACKEND_TAG"

            echo "===== Docker Login to ECR ====="
            aws ecr get-login-password --region $AWS_REGION \
              | docker login --username AWS --password-stdin $ECR_REGISTRY

            echo "===== Pulling Docker Images ====="
            docker pull $ECR_REGISTRY/$ECR_REPO:$FRONTEND_TAG
            docker pull $ECR_REGISTRY/$ECR_REPO:$BACKEND_TAG

            echo "===== Deploying Containers ====="
            docker compose --env-file .env up -d --remove-orphans

            echo "===== Running Containers ====="
            docker ps

            echo "===== Cleanup Unused Images ====="
            docker image prune -f



