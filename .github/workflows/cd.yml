name: CD-Deploy

on:
  workflow_run:
    workflows: ["CI-Build"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo so .env exists in runner workspace
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Load .env into GitHub Actions environment
      - name: Load environment variables from .env
        run: |
          set -a
          source .env
          set +a

          # Export explicitly to GitHub Actions env context
          echo "EC2_USER=$EC2_USER" >> $GITHUB_ENV

      # 3️⃣ Download docker-compose artifact from CI
      - name: Download compose artifact
        uses: actions/download-artifact@v4
        with:
          name: compose
          path: ./deploy

      # 4️⃣ Upload docker-compose.yml to EC2
      - name: Upload compose to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "./deploy/docker-compose.yml"
          target: "/home/${{ env.EC2_USER }}/app"

      # 5️⃣ SSH into EC2 and deploy
      - name: SSH and redeploy
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ env.EC2_USER }}/app
            docker compose pull
            docker compose up -d --remove-orphans


#name compose defined in ci.yml under Upload compose file