name: CD-Deploy

on:
  workflow_run:
    workflows: ["CI-Build"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo for .env and docker-compose.yml
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2️⃣ Load environment variables
      - name: Load environment variables
        run: |
          set -a
          source .env
          set +a
          echo "EC2_USER=$EC2_USER" >> $GITHUB_ENV
          echo "ECR_REGISTRY=$ECR_REGISTRY" >> $GITHUB_ENV
          echo "ECR_REPO=$ECR_REPO" >> $GITHUB_ENV
          echo "FRONTEND_TAG=$FRONTEND_TAG" >> $GITHUB_ENV
          echo "BACKEND_TAG=$BACKEND_TAG" >> $GITHUB_ENV
          echo "AWS_REGION=$AWS_REGION" >> $GITHUB_ENV

      # 3️⃣ Upload docker-compose.yml and .env to EC2
      - name: Upload compose and .env
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: |
            docker-compose.yml
            .env
          target: "/home/${{ env.EC2_USER }}/app"

      # 4️⃣ SSH into EC2, login to ECR, pull images, deploy
      - name: SSH and deploy
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ env.EC2_USER }}/app
            # Login to ECR
            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
            # Export environment variables for docker-compose
            export $(grep -v '^#' .env | xargs)
            # Pull pre-built images
            docker compose pull
            # Deploy
            docker compose up -d --remove-orphans







