name: CD-Deploy

on:
  workflow_run:
    workflows: ["CI-Build"]
    types: [completed]

permissions:
  contents: read
  actions: read  # Required for workflow_run metadata

jobs:
  deploy:
    # Only run if the triggering CI workflow succeeded
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository (needed for .env and docker-compose.yml)
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Load environment variables
      - name: Load .env
        run: |
          set -a
          [ -f .env ] && source .env
          set +a
          echo "ECR_REGISTRY=$ECR_REGISTRY" >> $GITHUB_ENV
          echo "ECR_REPO=$ECR_REPO" >> $GITHUB_ENV
          echo "AWS_REGION=$AWS_REGION" >> $GITHUB_ENV

      # 3️⃣ Upload files to EC2
      - name: Upload files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,.env"
          target: "/home/${{ secrets.EC2_USER }}/app"

      # 4️⃣ SSH into EC2 and deploy with full debug
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            APP_DIR="/home/${{ secrets.EC2_USER }}/app"
            cd $APP_DIR

            echo "===== Loading Environment Variables ====="
            set -a
            [ -f .env ] && source .env
            set +a
            echo "ECR_REGISTRY=$ECR_REGISTRY"
            echo "ECR_REPO=$ECR_REPO"
            echo "AWS_REGION=$AWS_REGION"

            echo "===== Computing Deterministic Image Tags ====="
            FRONTEND_TAG=$(git rev-parse --short $GITHUB_SHA)-frontend
            BACKEND_TAG=$(git rev-parse --short $GITHUB_SHA)-backend
            echo "FRONTEND_TAG=$FRONTEND_TAG"
            echo "BACKEND_TAG=$BACKEND_TAG"

            echo "===== Docker Login to ECR ====="
            set -x
            aws ecr get-login-password --region $AWS_REGION \
              | docker login --username AWS --password-stdin $ECR_REGISTRY

            echo "===== Pulling Docker Images ====="
            docker pull $ECR_REGISTRY/$ECR_REPO:$FRONTEND_TAG || exit 1
            docker pull $ECR_REGISTRY/$ECR_REPO:$BACKEND_TAG || exit 1

            echo "===== List Docker Images ====="
            docker images

            echo "===== Deploying Containers ====="
            docker compose --env-file .env up -d --remove-orphans

            echo "===== Running Containers ====="
            docker ps

            echo "===== Cleanup Unused Images ====="
            docker image prune -f












