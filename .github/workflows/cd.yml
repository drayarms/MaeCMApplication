name: CD-Deploy

on:
  workflow_run:
    workflows: ["CI-Build"]
    types: [completed]

permissions:
  contents: read
  actions: read  # Required to download artifacts

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo (for docker-compose.yml & .env)
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Download image tags artifact from CI
      - name: Download image tags
        uses: actions/download-artifact@v4
        with:
          name: image-tags
          run-id: ${{ github.event.workflow_run.id }}

      # 3️⃣ Load environment and image tags
      - name: Load environment
        run: |
          set -a
          source .env
          source image-tags.env
          set +a

          echo "ECR_REGISTRY=$ECR_REGISTRY" >> $GITHUB_ENV
          echo "ECR_REPO=$ECR_REPO" >> $GITHUB_ENV
          echo "FRONTEND_TAG=$FRONTEND_TAG" >> $GITHUB_ENV
          echo "BACKEND_TAG=$BACKEND_TAG" >> $GITHUB_ENV
          echo "EC2_USER=$EC2_USER" >> $GITHUB_ENV

      # 4️⃣ Upload compose + env files to EC2
      - name: Upload files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,image-tags.env,.env"
          target: "/home/${{ env.EC2_USER }}/app"

      # 5️⃣ SSH into EC2 and deploy
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ env.EC2_USER }}/app

            # Ensure env variables are loaded
            set -a
            source .env
            source image-tags.env
            set +a

            # Authenticate Docker to ECR (using IAM role attached to EC2)
            aws ecr get-login-password --region $AWS_REGION \
              | docker login --username AWS --password-stdin $ECR_REGISTRY

            # Pull images using immutable tags from CI
            docker compose pull

            # Deploy containers
            docker compose up -d --remove-orphans







