name: CI-Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load .env
        run: |
          set -a
          source .env
          set +a
          echo "AWS_REGION=$AWS_REGION" >> $GITHUB_ENV
          echo "AWS_ROLE_TO_ASSUME=$AWS_ROLE_TO_ASSUME" >> $GITHUB_ENV
          echo "ECR_REGISTRY=$ECR_REGISTRY" >> $GITHUB_ENV
          echo "ECR_REPO=$ECR_REPO" >> $GITHUB_ENV

      - name: Set image tags
        run: |
          FRONTEND_TAG=$(git rev-parse --short HEAD)-frontend
          BACKEND_TAG=$(git rev-parse --short HEAD)-backend
          echo "FRONTEND_TAG=$FRONTEND_TAG" >> $GITHUB_ENV
          echo "BACKEND_TAG=$BACKEND_TAG" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push Docker images
        run: |
          docker compose build frontend backend
          docker compose push frontend
          docker compose push backend

      - name: Upload docker-compose.yml artifact
        uses: actions/upload-artifact@v4
        with:
          name: compose
          path: docker-compose.yml




#source .env actually refers to $GITHUB_WORKSPACE/.env which is root of dir
#$ECR_REGISTRY from .env
#AWS_REGION from .env
#We need .env and .env.example in root. There we define out ECR

