name: CI-Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write  # REQUIRED for OIDC
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Load environment variables
      - name: Load environment variables
        run: |
          set -a
          source .env
          set +a
          echo "AWS_REGION=$AWS_REGION" >> $GITHUB_ENV
          echo "AWS_ROLE_TO_ASSUME=$AWS_ROLE_TO_ASSUME" >> $GITHUB_ENV
          echo "ECR_REGISTRY=$ECR_REGISTRY" >> $GITHUB_ENV   
          echo "ECR_REPO=$ECR_REPO" >> $GITHUB_ENV    
          echo "BACKEND_TAG=$BACKEND_TAG" >> $GITHUB_ENV  
          echo "FRONTEND_TAG=$FRONTEND_TAG" >> $GITHUB_ENV

      # 3️⃣ Configure AWS
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # 4️⃣ Login to ECR
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 5️⃣ Build & push images
      - name: Build and push images
        run: |
          docker compose build
          docker tag frontend:latest $ECR_REGISTRY/$ECR_REPO:$FRONTEND_TAG
          docker tag backend:latest $ECR_REGISTRY/$ECR_REPO:$BACKEND_TAG
          docker push $ECR_REGISTRY/$ECR_REPO:$FRONTEND_TAG
          docker push $ECR_REGISTRY/$ECR_REPO:$BACKEND_TAG

      # 6️⃣ Upload docker-compose.yml as artifact
      - name: Upload compose file
        uses: actions/upload-artifact@v4
        with:
          name: compose
          path: docker-compose.yml



#source .env actually refers to $GITHUB_WORKSPACE/.env which is root of dir
#$ECR_REGISTRY from .env
#AWS_REGION from .env
#We need .env and .env.example in root. There we define out ECR

