name: CI-Build

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 3️⃣ Log in to ECR
      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
            | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

      # 4️⃣ Compute deterministic image tags based on git SHA
      - name: Compute image tags
        id: image-tags
        run: |
          FRONTEND_TAG=$(git rev-parse --short HEAD)-frontend
          BACKEND_TAG=$(git rev-parse --short HEAD)-backend
          echo "FRONTEND_TAG=$FRONTEND_TAG" >> $GITHUB_ENV
          echo "BACKEND_TAG=$BACKEND_TAG" >> $GITHUB_ENV
          echo "ECR_REGISTRY=${{ secrets.ECR_REGISTRY }}" >> $GITHUB_ENV
          echo "ECR_REPO=${{ secrets.ECR_REPO }}" >> $GITHUB_ENV
          # Save tags to file for CD workflow
          echo "FRONTEND_TAG=$FRONTEND_TAG" > image-tags.env
          echo "BACKEND_TAG=$BACKEND_TAG" >> image-tags.env
          echo "ECR_REGISTRY=${{ secrets.ECR_REGISTRY }}" >> image-tags.env
          echo "ECR_REPO=${{ secrets.ECR_REPO }}" >> image-tags.env

      # 5️⃣ Build Docker images
      - name: Build frontend image
        run: |
          docker build \
            -t ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPO }}:${FRONTEND_TAG} \
            ./frontend

      - name: Build backend image
        run: |
          docker build \
            -t ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPO }}:${BACKEND_TAG} \
            ./backend

      # 6️⃣ Push images to ECR
      - name: Push frontend image
        run: |
          docker push ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPO }}:${FRONTEND_TAG}

      - name: Push backend image
        run: |
          docker push ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPO }}:${BACKEND_TAG}

      # 7️⃣ Upload image tags as artifact for CD workflow
      - name: Upload image-tags artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tags
          path: image-tags.env






#source .env actually refers to $GITHUB_WORKSPACE/.env which is root of dir
