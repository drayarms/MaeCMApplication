name: CI-Build

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  actions: write  # needed for uploading artifacts

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2️⃣ Set deterministic image tags
      - name: Set image tags
        run: |
          echo "FRONTEND_TAG=${GITHUB_SHA}-frontend" > image-tags.env
          echo "BACKEND_TAG=${GITHUB_SHA}-backend" >> image-tags.env

      # 3️⃣ Login to ECR
      - name: AWS ECR Login
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry: ${{ secrets.ECR_REGISTRY }}

      # 4️⃣ Build and push frontend
      - name: Build and push frontend
        run: |
          docker build -t ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPO }}:${FRONTEND_TAG} ./frontend
          docker push ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPO }}:${FRONTEND_TAG}

      # 5️⃣ Build and push backend
      - name: Build and push backend
        run: |
          docker build -t ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPO }}:${BACKEND_TAG} ./backend
          docker push ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPO }}:${BACKEND_TAG}

      # 6️⃣ Upload image-tags artifact for CD
      - name: Upload image-tags artifact
        uses: actions/upload-artifact@v3
        with:
          name: image-tags
          path: image-tags.env






#source .env actually refers to $GITHUB_WORKSPACE/.env which is root of dir
#$ECR_REGISTRY from .env
#AWS_REGION from .env
#We need .env and .env.example in root. There we define out ECR

